{% extends "base.html" %}

{% block main_content %}
    <div class="tag-cloud">
        {% block title %}
            {{<post.page_header title="tags" />}}
        {% endblock title %}

        <main class="list">
            <ul class="tags">
                {% for term in terms %}
                <li>
                    <a href="{{ term.permalink | safe }}">
                        {{ term.name }} ({{ term.page_count }} post{{ term.page_count | pluralize }})
                    </a>
                </li>
                {% endfor %}
            </ul>
        </main>
    </div>
{% endblock main_content %}
